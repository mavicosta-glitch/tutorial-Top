<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Central de Tutoriais — Plataforma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Cabeçalho Público -->
    <header class="public-header">
      <div class="container public-header-inner">
        <a href="#/" class="brand-mark" id="brand-home-link">
          <span class="brand-logo-box" aria-hidden="true">◎</span>
          <span class="brand-title" id="brand-name">TOP</span>
          <span class="brand-badge" id="brand-badge">APP</span>
        </a>

        <nav class="public-nav-pill" aria-label="Navegação principal">
          <button type="button" id="nav-home" class="is-active">Tutoriais</button>
          <button type="button" id="nav-categories">Categorias</button>
        </nav>

        <div class="public-header-actions">
          <a
            id="whatsapp-cta"
            href="https://wa.me/5571999999999"
            target="_blank"
            rel="noopener noreferrer"
            class="whatsapp-btn"
          >
            💬 <span id="whatsapp-label">Fale Conosco no WhatsApp</span>
          </a>
          <a href="./admin.html" class="admin-pill-btn">⚙ Admin</a>
        </div>
      </div>
    </header>

    <!-- Conteúdo Dinâmico -->
    <main id="portal-root" class="container"></main>

    <!-- Lightbox de Ampliação de Fotos -->
    <div id="photo-lightbox" class="lightbox" hidden role="dialog" aria-modal="true">
      <button type="button" id="lightbox-close" class="btn btn-gold btn-sm">
        ✕ Fechar imagem
      </button>
      <img id="lightbox-img" src="" alt="" />
      <p id="lightbox-caption" class="lightbox-caption"></p>
    </div>

    <script type="module" src="./js/portal.js"></script>
  </body>
</html>
